events {
    worker_connections 1024;
}

http {
    upstream api_backend {
        server api1:3000;
        server api2:3000;
    }

    # Abuse Defense Outer Layer: limit connections and reqs per IP
    # High threshold to allow application layer (Fastify) to handle normal/medium floods
    limit_req_zone $binary_remote_addr zone=ip_reqs:10m rate=2000r/s;
    limit_conn_zone $binary_remote_addr zone=ip_conns:10m;

    server {
        listen 80;

        location / {
            limit_req zone=ip_reqs burst=1000 nodelay;
            limit_conn ip_conns 200;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /drop/stream {
            limit_req zone=ip_reqs burst=1000 nodelay;
            limit_conn ip_conns 200;

            proxy_pass http://api_backend/drop/stream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # SSE specific requirements: disable proxy buffering
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 24h;
        }
    }
}
