version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fairdrop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  api1:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://postgres:password@db:5432/fairdrop
      - REDIS_URL=redis://redis:6379
      - REPLICA_ID=api1
    depends_on:
      - db
      - redis

  api2:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://postgres:password@db:5432/fairdrop
      - REDIS_URL=redis://redis:6379
      - REPLICA_ID=api2
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2

volumes:
  pgdata:
  redisdata:
